[package]
name = "graphify"
version = "0.3.12"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = "0.6"
thiserror = "1.0"
sha2 = "0.11.0"
hex = "0.4.3"
regex = "1.12.3"
glob = "0.3.3"
walkdir = "2.5.0"
lazy_static = "1.5.0"
reqwest = { version = "0.13.2", features = ["blocking"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
